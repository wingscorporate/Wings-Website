name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public API URL only. Private Google configuration stays in Render.
      VITE_CAREERS_API_URL: ${{ vars.VITE_CAREERS_API_URL || 'https://wings-careers-api.onrender.com/api/careers/applications' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run lint
      - name: Test careers API with simulated Google services
        run: npm run test:careers
      - name: Verify public careers endpoint configuration
        run: npm run check:careers-config
      - name: Build static site
        run: npm run build:frontend
        env:
          GITHUB_ACTIONS: 'true'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
